seed: 42
data:
  documents_path: ./data/documents.jsonl
  questions_path: ./data/dev/dev.json      
  embeddings_npz: ./data/id_to_embedding.npz
index:
  output_dir: ./artifacts/index
retrieval:
  use_sparse: true
  use_dense: false
  fusion: rrf
  dense_topk: 400
  sparse_topk: 600
  final_topk: 300
  rrf_k: 60
run:
  output_csv: ./artifacts/submission_dev.csv
  supports_k: 100
  option_query_join: " "
  temperature: 1.0
  top_m_per_option: 10
  token_weight: 1.0
  phrase_bonus: 1.0
